name: web

# Verify only: Vercel builds and deploys the web app. Kept apart from `backend` so a web-only
# failure never blocks an API deploy (and the reverse).
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `...` adds the workspace packages the web app depends on (@cardai/shared, @cardai/templates).
      - run: npx turbo run typecheck lint test --filter=@cardai/web...
      # Every internal link must hit a real route, blog post or public file.
      - run: npm run check:links -w @cardai/web
