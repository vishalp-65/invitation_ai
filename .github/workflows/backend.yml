name: backend

# CI/CD for the API + worker:
#   verify (typecheck, lint, test) -> build images on GitHub's runners (never on the 2 GB droplet) -> push to GHCR
#   -> SSH to the droplet -> infra/deploy/deploy.sh (migrate, swap, health gate, rollback)
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/**'
      - 'infra/docker/**'
      - 'infra/deploy/**'
      - 'package-lock.json'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/**'
      - 'infra/docker/**'
      - 'infra/deploy/**'
      - 'package-lock.json'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/noyta
  APP_DIR: /opt/noyta

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx turbo run typecheck lint test --filter=@cardai/api... --filter=@cardai/worker...

  build:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # One plain manifest per image: no attestation blobs to store or pull
          provenance: false

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"
      - name: Copy compose file + deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: infra/deploy/docker-compose.prod.yml,infra/deploy/deploy.sh
          target: ${{ env.APP_DIR }}
          strip_components: 2
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          TAG: ${{ github.sha }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,TAG,PREFIX,APP_DIR
          script_stop: true
          # infra/deploy/deploy.sh: pull, migrate, swap, health gate, rollback, old-image cleanup
          script: |
            set -eu
            # read:packages token only; the login stays so a manual ./deploy.sh rollback can pull too
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            bash "$APP_DIR/deploy.sh" "$PREFIX" "$TAG"
