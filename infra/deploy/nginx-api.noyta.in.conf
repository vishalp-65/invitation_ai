# /etc/nginx/sites-available/api.noyta.in  ->  Noyta API container on 127.0.0.1:4100
# bootstrap.sh installs it; certbot --nginx -d api.noyta.in then adds the 443 block and the HTTP->HTTPS redirect.
upstream noyta_api {
  server 127.0.0.1:4100;
  keepalive 16;   # reuse connections instead of a new TCP handshake per request
}

server {
  listen 80;
  listen [::]:80;
  server_name api.noyta.in;

  # Card scans post up to ~6 MB of base64 photos; file uploads go straight to Spaces.
  client_max_body_size 10m;

  # API responses are JSON; the app itself does not compress
  gzip on;
  gzip_types application/json text/plain;
  gzip_min_length 1024;
  gzip_proxied any;   # requests arrive through Vercel's proxy

  location / {
    proxy_pass http://noyta_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
  }
}
