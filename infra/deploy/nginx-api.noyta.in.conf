# /etc/nginx/sites-available/api.noyta.in  ->  Noyta API container on 127.0.0.1:4100
# certbot --nginx -d api.noyta.in adds the 443 server block and the HTTP->HTTPS redirect.
server {
  listen 80;
  listen [::]:80;
  server_name api.noyta.in;

  # Card scans post up to ~6 MB of base64 photos; file uploads go straight to Spaces.
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
  }
}
