# Runs on the droplet in /opt/noyta, next to /opt/interviewpilot and fully isolated from it:
#  - own compose project name (noyta), own network, no shared volumes
#  - only the API is published, on 127.0.0.1:4100 (loopback); the host's nginx routes api.noyta.in to it
#  - Postgres (Neon) is a managed service: DATABASE_URL comes from .env
#  - Redis runs here as the `redis` service (internal network only, AOF persistence). BullMQ polls Redis
#    constantly, which per-command-billed hosts (Upstash) count against the quota. REDIS_URL is built below
#    from REDIS_PASSWORD (set it in .env) and overrides any REDIS_URL left in .env.
# Images are set by deploy.sh through .deploy.env (REGISTRY_IMAGE_API / REGISTRY_IMAGE_WORKER).
#
# Defaults fit a shared 1 vCPU / 2 GB droplet (+ swap). Override any ${VAR:-default} in .env.
name: noyta

x-app: &app
  env_file: .env
  restart: unless-stopped
  # tini as PID 1: forwards SIGTERM and reaps Chrome's child processes
  init: true
  logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No `ports:`: reachable only by api/worker on this project's network.
    # noeviction is required by BullMQ (an evicted queue key corrupts jobs); maxmemory caps it for the shared droplet.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --save
      - '3600 1'
    volumes: ['redis-data:/data']
    mem_limit: ${REDIS_MEMORY:-320m}
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    <<: *app
    image: ${REGISTRY_IMAGE_API:?set REGISTRY_IMAGE_API}
    ports: ['127.0.0.1:${API_HOST_PORT:-4100}:4000']
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      API_PORT: '4000'
      # Keep the V8 heap well under the container limit so GC runs before the OOM killer does
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=320}
    mem_limit: ${API_MEMORY:-512m}

  worker:
    <<: *app
    image: ${REGISTRY_IMAGE_WORKER:?set REGISTRY_IMAGE_WORKER}
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
      REMOTION_CONCURRENCY: ${REMOTION_CONCURRENCY:-1}
      OFFTHREAD_VIDEO_CACHE_MB: ${OFFTHREAD_VIDEO_CACHE_MB:-128}
      BROWSER_RECYCLE_AFTER: ${BROWSER_RECYCLE_AFTER:-20}
      BROWSER_IDLE_CLOSE_SEC: ${BROWSER_IDLE_CLOSE_SEC:-300}
    # Chrome uses /dev/shm for frames; it counts against mem_limit, so keep it modest
    shm_size: ${WORKER_SHM:-512m}
    mem_limit: ${WORKER_MEMORY:-1500m}
    # CPU weight (default 1024 = equal to other containers; 512 = half). Idle CPU is always usable
    cpu_shares: ${WORKER_CPU_SHARES:-512}
    # Let an in-flight render finish (or reach a checkpoint) before a deploy kills it
    stop_grace_period: 2m

volumes:
  redis-data:
